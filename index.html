<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Cena 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="controls">
        <h2>Motor de Cena 2D</h2>

        <div class="control-group">
            <label>Função Implícita <span class="hint">f(x, y) = 0</span></label>
            <input type="text" id="inputFunc" placeholder="Ex: x*x + y*y - 0.25">
            <small>Use x, y no domínio −2 a 2</small>
            <button id="btnAddFunc" class="btn-green">Adicionar Função</button>
        </div>

        <div class="control-group">
            <label>Primitivas</label>
            <button id="btnCircle" class="btn-blue">+ Círculo <span class="hint">(clique no canvas)</span></button>
            <button id="btnParabola" class="btn-blue">+ Parábola</button>
            <button id="btnParticles" class="btn-yellow">+ Partícula Dinâmica</button>
            <button id="btnClear" class="btn-red">Limpar Cena</button>
        </div>

        <div class="control-group">
            <label>Modo de Visualização</label>
            <button id="btnRayTracer" class="btn-mode active">Lanterna</button>
            <button id="btnAdaptive" class="btn-mode">Estrutura Quadtree</button>
        </div>

        <div class="control-group" id="groupLightRange">
            <label>Alcance da Lanterna <span id="lightRangeVal" class="hint">300px</span></label>
            <input type="range" id="lightRange" min="50" max="600" value="300">
        </div>

        <div class="control-group" id="groupRes">
            <label>Profundidade Máxima <span id="resVal" class="hint">7</span></label>
            <input type="range" id="resRange" min="2" max="10" value="7">
        </div>

        <div class="control-group">
            <label>Raios <span id="raysVal" class="hint">720</span></label>
            <input type="range" id="raysRange" min="90" max="1440" step="90" value="720">
        </div>
    </div>

    <canvas id="mainCanvas" width="700" height="700"></canvas>

    <script src="js/geometry.js"></script>
    <script src="js/adaptive.js"></script>
    <script src="js/raytracer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
